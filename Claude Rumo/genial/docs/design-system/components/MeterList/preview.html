<!-- @dsCard group="Exibição" height=280 subtitle="Valores com barra proporcional (pesos de critérios)" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>MeterList</title>
<style>html,body{margin:0;background:var(--bg-page)} .pv{padding:24px} </style></head>
<body>
<div class="gn pv" style="max-width:340px">
  <section class="gn-card">
    <div class="gn-card__header"><div><h2 class="gn-card__title">Critérios da avaliação</h2><p class="gn-card__subtitle">Pesos definidos pelo RH para outubro de 2026.</p></div></div>
    <div class="gn-card__body">
      <ul class="gn-meters">
        <li><div class="gn-meter__row"><span>Impacto gerado</span><span class="gn-meter__value">40%</span></div><div class="gn-progress" aria-hidden="true"><span style="width:40%"></span></div></li>
        <li><div class="gn-meter__row"><span>Complexidade e esforço</span><span class="gn-meter__value">25%</span></div><div class="gn-progress" aria-hidden="true"><span style="width:25%"></span></div></li>
        <li><div class="gn-meter__row"><span>Iniciativa e proatividade</span><span class="gn-meter__value">20%</span></div><div class="gn-progress" aria-hidden="true"><span style="width:20%"></span></div></li>
        <li><div class="gn-meter__row"><span>Evidências do resultado</span><span class="gn-meter__value">15%</span></div><div class="gn-progress" aria-hidden="true"><span style="width:15%"></span></div></li>
      </ul>
    </div>
  </section>
</div>
</body>
</html>
