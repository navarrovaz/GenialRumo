<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>FilterChip</title>

    <button class="gn-chip" type="button">Todos os dias<svg class="gn-icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="m6 9 6 6 6-6" /> </svg></button>

  </div>
  <div class="gn-segmented" role="group" aria-label="Visualização">
    <button type="button" aria-pressed="true">Mês</button><button type="button">Semana</button><button type="button">Dia</button>
  </div>
</div>

</html>
