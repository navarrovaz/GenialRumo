<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>Topbar</title>
<style>html,body{margin:0;background:var(--bg-page)} .pv{padding:24px} </style></head>
<body>
<div class="gn gn-stack" style="gap:24px;padding:24px 0">
  <header class="gn-topbar">
    <nav class="gn-breadcrumb" aria-label="Você está em"><span>Meu ponto</span><svg class="gn-icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="m9 18 6-6-6-6" /> </svg><span aria-current="page">Horas lançadas</span></nav>
    <div class="gn-topbar__actions">
      <button class="gn-iconbtn" type="button" aria-label="Ajuda"><svg class="gn-icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <circle cx="12" cy="12" r="10" /> <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /> <path d="M12 17h.01" /> </svg></button>
      <button class="gn-iconbtn" type="button" aria-label="Notificações, 3 novas"><svg class="gn-icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /> <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /> </svg><span class="gn-iconbtn__dot"></span></button>
      <span class="gn-avatar gn-avatar--sm" aria-hidden="true">GM</span>
    </div>
  </header>
  <div style="max-width:390px;margin:0 16px;border:1px solid var(--border-default);border-radius:var(--radius-lg);overflow:hidden">
    <header class="gn-appbar"><button class="gn-iconbtn" type="button" aria-label="Abrir menu"><svg class="gn-icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <line x1="4" x2="20" y1="12" y2="12" /> <line x1="4" x2="20" y1="6" y2="6" /> <line x1="4" x2="20" y1="18" y2="18" /> </svg></button><span class="gn-appbar__title">Registrar ponto</span><button class="gn-iconbtn" type="button" aria-label="Atualizar"><svg class="gn-icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /> <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /> <path d="M8 16H3v5" /> </svg></button></header>
  </div>
</div>
</body>
</html>
