<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>Avatar</title>

<div class="gn pv gn-stack" style="max-width:640px">
  <div class="gn-row" style="gap:12px">
    <span class="gn-avatar gn-avatar--img gn-avatar--sm"><img src="../../assets/avatares/avatar-02.svg" alt="Ana Ribeiro"></span>
    <span class="gn-avatar gn-avatar--img"><img src="../../assets/avatares/avatar-02.svg" alt="Ana Ribeiro"></span>

    <span class="gn-avatar gn-avatar--lg">AR</span>

    <label class="gn-avatar-option"><input type="radio" name="av" aria-label="Avatar 2" checked><span class="gn-avatar gn-avatar--img"><img src="../../assets/avatares/avatar-02.svg" alt=""></span><span class="gn-avatar-option__check" aria-hidden="true"><svg class="gn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></label>
    <label class="gn-avatar-option"><input type="radio" name="av" aria-label="Avatar 3"><span class="gn-avatar gn-avatar--img"><img src="../../assets/avatares/avatar-03.svg" alt=""></span><span class="gn-avatar-option__check" aria-hidden="true"><svg class="gn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></label>
    <label class="gn-avatar-option"><input type="radio" name="av" aria-label="Avatar 4"><span class="gn-avatar gn-avatar--img"><img src="../../assets/avatares/avatar-04.svg" alt=""></span><span class="gn-avatar-option__check" aria-hidden="true"><svg class="gn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></label>

    <label class="gn-avatar-option"><input type="radio" name="av" aria-label="Avatar 7"><span class="gn-avatar gn-avatar--img"><img src="../../assets/avatares/avatar-07.svg" alt=""></span><span class="gn-avatar-option__check" aria-hidden="true"><svg class="gn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></label>
