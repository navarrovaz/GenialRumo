<!doctype html>

  <div class="gn-attach-actions">
    <button class="gn-btn gn-btn--secondary gn-btn--sm" type="button"><svg class="gn-icon gn-icon--sm" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>Anexar arquivo</button>

</html>
