<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>StatCard</title>
<style>html,body{margin:0;background:var(--bg-page)} .pv{padding:24px} </style></head>
<body>
<div class="gn pv gn-grid-stats" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
  <div class="gn-card gn-stat"><div class="gn-stat__head"><span class="gn-stat__label">Horas lançadas</span><span class="gn-stat__icon"><svg class="gn-icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <circle cx="12" cy="12" r="10" /> <polyline points="12 6 12 12 16 14" /> </svg></span></div><span class="gn-stat__value">84:36</span><div class="gn-progress" role="img" aria-label="50% de 168 horas"><span style="width:50%"></span></div><span class="gn-stat__meta gn-num">de 168:00 esperadas</span></div>
  <div class="gn-card gn-stat"><div class="gn-stat__head"><span class="gn-stat__label">Saldo do mês</span><span class="gn-stat__icon"><svg class="gn-icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5" /> <path d="M16 2v4" /> <path d="M8 2v4" /> <path d="M3 10h5" /> <path d="M17.5 17.5 16 16.3V14" /> <circle cx="16" cy="16" r="6" /> </svg></span></div><span class="gn-stat__value gn-stat__value--neg">−11:20</span><span class="gn-stat__meta"><span class="gn-delta gn-delta--neg"><svg class="gn-icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <polyline points="22 17 13.5 8.5 8.5 13.5 2 7" /> <polyline points="16 17 22 17 22 11" /> </svg>−04:12</span>ontem</span></div>
  <div class="gn-card gn-stat"><div class="gn-stat__head"><span class="gn-stat__label">Banco de horas</span><span class="gn-stat__icon"><svg class="gn-icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /> <path d="M3 3v5h5" /> <path d="M12 7v5l4 2" /> </svg></span></div><span class="gn-stat__value gn-stat__value--neg">−24:04</span><span class="gn-stat__meta">Inclui meses anteriores</span></div>
  <div class="gn-card gn-stat"><div class="gn-stat__head"><span class="gn-stat__label">Extra a receber</span><span class="gn-stat__icon"><svg class="gn-icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z" /> <path d="M14 8H8" /> <path d="M16 12H8" /> <path d="M13 16H8" /> </svg></span></div><span class="gn-stat__value">00:00</span><span class="gn-stat__meta">Nenhuma hora extra aprovada</span></div>
</div>
</body>
</html>
